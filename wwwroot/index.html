<!DOCTYPE html>
<html>
<head>
    <title>Stock</title>
</head>
<body>

<h2>Lista de Productos</h2>

<table border="1">
    <thead>
        <tr id="encabezado"></tr>
    </thead>
    <tbody id="cuerpo"></tbody>
</table>

<script>
async function cargarDatos() {
    const encabezado = document.getElementById("encabezado");
    const cuerpo = document.getElementById("cuerpo");

    cuerpo.innerHTML = "<tr><td>Cargando...</td></tr>";

    const respuesta = await fetch("https://mi-api-stock.onrender.com/stock");
    const datos = await respuesta.json();

    encabezado.innerHTML = "";
    cuerpo.innerHTML = "";

    const columnas = Object.keys(datos[0]);

    columnas.forEach(col => {
        encabezado.innerHTML += `<th>${col}</th>`;
    });

    datos.forEach(item => {
        let fila = "<tr>";

        columnas.forEach(col => {
            fila += `<td>${item[col]}</td>`;
        });

        fila += "</tr>";
        cuerpo.innerHTML += fila;
    });
}

// Carga automática
window.onload = cargarDatos;
</script>

</body>
</html>
